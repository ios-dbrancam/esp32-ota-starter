[platformio]
extra_configs = secrets.ini

[env:seeed-xiao-esp32-c3]
platform = Seeed Studio
board = seeed-xiao-esp32-c3
framework = arduino
lib_deps =
    knolleary/PubSubClient

; Uncomment the lines below to flash via OTA
upload_protocol = espota
upload_port = ${secrets.hostname}
upload_flags = --auth=${secrets.password}
